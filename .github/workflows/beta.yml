name: Beta

on:
  push:
    branches: [beta]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Deploy beta.edgeloop.app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing GitHub secret CLOUDFLARE_API_TOKEN."
            echo "Create a Cloudflare API token for the edgeloop.app zone with Workers Scripts Edit, Workers Routes Edit, DNS Edit, and Zone Read."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx wrangler deploy --env beta
